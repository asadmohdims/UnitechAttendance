name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # archive/ is a kept-for-reference old draft (see archive/source/README.md) — it isn't
      # part of the live app and shouldn't ship to the public site alongside it.
      - name: Prepare site (exclude archive/)
        run: |
          mkdir _site
          rsync -a --exclude='archive' --exclude='.git' --exclude='_site' ./ _site/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
