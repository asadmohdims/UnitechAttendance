name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # archive/ is a kept-for-reference old draft (see archive/source/README.md) — it isn't
      # part of the live app and shouldn't ship to the public site alongside it.
      - name: Prepare site (exclude archive/)
        run: |
          mkdir _site
          rsync -a --exclude='archive' --exclude='.git' --exclude='_site' ./ _site/

      # Stamps this deploy with a real version string — there's no bundler/build step to inject
      # one, so it's done here instead. Overwrites the repo's committed 'dev' placeholders in
      # three places that must agree: version.json (polled by js/ui/appVersion.js to notice a new
      # deploy), js/version.js (the kiosk's on-screen version), and sw.js (its cache name — and
      # changing sw.js's bytes is what makes browsers install the new service worker at all).
      # The grep fails the deploy if the sw.js placeholder line ever changes shape, rather than
      # silently shipping a worker stuck on 'dev'.
      - name: Stamp version
        run: |
          VERSION="$(git rev-parse --short HEAD)-$(date -u +%Y%m%d%H%M)"
          echo "{\"version\":\"$VERSION\"}" > _site/version.json
          echo "export const APP_VERSION = '$VERSION';" > _site/js/version.js
          sed -i "s/^const VERSION = 'dev';$/const VERSION = '$VERSION';/" _site/sw.js
          grep -q "^const VERSION = '$VERSION';$" _site/sw.js

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
