<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Unitech Attendance</title>
  <!-- A blue U with a green tick: deliberately unlike v1's calendar, so a tablet showing both is never ambiguous. -->
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <!-- Set the saved theme before the first paint so a dark device never flashes white. Same key as src/theme.ts. -->
  <script>try{if(localStorage.getItem('tc2:theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
